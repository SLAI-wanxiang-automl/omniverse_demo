<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">NWP 机器学习降尺度示意图</title>
  <desc id="desc">左侧粗分辨率气象网格经过中间的机器学习网络，转换为右侧风电场精细气象网格。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#e8fbf8"/>
    </linearGradient>
    <linearGradient id="coarse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".86"/>
      <stop offset=".52" stop-color="#38bdf8" stop-opacity=".76"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="fine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".82"/>
      <stop offset=".52" stop-color="#14b8a6" stop-opacity=".76"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity=".68"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#8a1c52"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <clipPath id="coarseClip"><rect x="36" y="74" width="202" height="272" rx="25"/></clipPath>
    <clipPath id="fineClip"><rect x="402" y="58" width="202" height="304" rx="25"/></clipPath>
  </defs>

  <rect x="8" y="8" width="624" height="404" rx="42" fill="url(#bg)" stroke="#bfdbfe" stroke-width="8"/>

  <!-- Coarse NWP field -->
  <g filter="url(#shadow)">
    <rect x="36" y="74" width="202" height="272" rx="25" fill="url(#coarse)" stroke="#fff" stroke-width="7"/>
    <g clip-path="url(#coarseClip)" stroke="#fff" stroke-opacity=".72" stroke-width="5">
      <path d="M86.5 74v272M137 74v272M187.5 74v272"/>
      <path d="M36 142h202M36 210h202M36 278h202"/>
    </g>
    <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="9" opacity=".92">
      <path d="M68 125h61c18 0 19-27 2-30-8-26-46-22-49 4-22-4-31 26-14 26Z"/>
      <path d="M151 253c25-12 39-10 57-1"/>
      <path d="M151 276c19-8 33-7 47-1"/>
      <path d="M151 299c14-5 25-4 34 0"/>
    </g>
    <circle cx="86" cy="244" r="17" fill="#fef3c7" stroke="#fff" stroke-width="7"/>
  </g>

  <!-- Machine-learning transformation -->
  <g>
    <path d="M251 210h120" fill="none" stroke="url(#flow)" stroke-width="15" stroke-linecap="round"/>
    <path d="m355 184 31 26-31 26" fill="none" stroke="#8a1c52" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#64748b" stroke-opacity=".58" stroke-width="4">
      <path d="M274 158l34 32m-34 62 34-30m0-32 34-29m-34 61 34 31m-68-95v94m34-62v32m34-61v92"/>
    </g>
    <g fill="#fff" stroke-width="7">
      <circle cx="274" cy="158" r="13" stroke="#2563eb"/>
      <circle cx="274" cy="252" r="13" stroke="#2563eb"/>
      <circle cx="308" cy="190" r="13" stroke="#0ea5e9"/>
      <circle cx="308" cy="222" r="13" stroke="#0ea5e9"/>
      <circle cx="342" cy="161" r="13" stroke="#8a1c52"/>
      <circle cx="342" cy="253" r="13" stroke="#8a1c52"/>
    </g>
  </g>

  <!-- Fine site-level field -->
  <g filter="url(#shadow)">
    <rect x="402" y="58" width="202" height="304" rx="25" fill="url(#fine)" stroke="#fff" stroke-width="7"/>
    <g clip-path="url(#fineClip)" stroke="#fff" stroke-opacity=".56" stroke-width="2.5">
      <path d="M427.25 58v304M452.5 58v304M477.75 58v304M503 58v304M528.25 58v304M553.5 58v304M578.75 58v304"/>
      <path d="M402 96h202M402 134h202M402 172h202M402 210h202M402 248h202M402 286h202M402 324h202"/>
    </g>
    <path d="M402 297c45-28 78-16 111-35 33-18 61-13 91-42v142H402Z" fill="#0f766e" opacity=".43"/>
    <g stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M430 116c34-15 68-13 105-2"/>
      <path d="M449 143c42-15 79-11 125 5"/>
      <path d="M421 177c28-9 52-8 77 0"/>
    </g>
    <!-- wind turbines -->
    <g stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M470 329v-82m0 0-26-26m26 26 35-12m-35 12-8 38"/>
      <circle cx="470" cy="247" r="7" fill="#fff"/>
      <path d="M548 320v-63m0 0-21-20m21 20 28-10m-28 10-5 29"/>
      <circle cx="548" cy="257" r="6" fill="#fff"/>
    </g>
    <circle cx="570" cy="88" r="17" fill="#fef3c7" stroke="#fff" stroke-width="6"/>
  </g>
</svg>
